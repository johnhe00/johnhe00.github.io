<!-- john-he-logo.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="44" viewBox="0 0 200 44" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">John He — artist wordmark</title>
  <desc id="logoDesc">Monogram JH in a circle followed by the name John He</desc>
  <defs>
    <!-- Tweak these to recolor globally -->
    <style>
      :root { --accent:#3a7ca5; --accent-dark:#2f6181; --text:#222; }
      .accent { fill: var(--accent); }
      .accent-stroke { stroke: var(--accent); }
      .word { fill: var(--text); }
      @media (prefers-color-scheme: dark) {
        :root { --text:#f4f7f9; }
      }
    </style>
  </defs>

  <!-- Monogram badge -->
  <g transform="translate(2,2)">
    <circle cx="20" cy="20" r="20" class="accent" opacity="0.12"/>
    <circle cx="20" cy="20" r="19" class="accent-stroke" fill="none" stroke-width="1.5" opacity="0.9"/>
    <!-- Stylized JH – geometric strokes so no font dependency -->
    <g transform="translate(8,8)" stroke="none" fill="var(--accent)">
      <!-- J -->
      <path d="M8 0h3v14.5a5.5 5.5 0 1 1-11 0h3a2.5 2.5 0 1 0 5 0V0z"/>
      <!-- H -->
      <path d="M16 0h3v9h6V0h3v24h-3v-9h-6v9h-3z"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(60,10)" class="word">
    <!-- “John” -->
    <path d="M0 18.2c0 2.5 1.8 4.2 4.2 4.2 1.6 0 2.9-.8 3.6-1.9v1.7h2.8V6.2H7.8v8.1c0 2-1.2 3.4-3 3.4-1.4 0-2.3-.9-2.3-2.5V6.2H0v12z"/>
    <path d="M15.2 22.2h2.8v-6c0-1.9 1-3 2.6-3s2.5 1 2.5 3v6h2.8v-6c0-1.9 1-3 2.6-3s2.5 1 2.5 3v6h2.8v-6.6c0-3.6-2-5.6-5-5.6-1.9 0-3.4.9-4.4 2.3-.8-1.5-2.3-2.3-4.1-2.3-1.8 0-3.3.8-4.3 2.2v-1.9h-2.8v11.9z"/>
    <path d="M40.7 14.1c0 4.8 3.5 8.3 8.2 8.3s8.2-3.5 8.2-8.3c0-4.8-3.5-8.3-8.2-8.3s-8.2 3.5-8.2 8.3zm13.5 0c0 3.1-2.2 5.5-5.3 5.5s-5.3-2.4-5.3-5.5 2.2-5.5 5.3-5.5 5.3 2.4 5.3 5.5z"/>
    <!-- “He” -->
    <path d="M65.1 22.2h2.8v-5.1h6.8v5.1h2.8V6.2h-2.8v8.2h-6.8V6.2h-2.8v16z"/>
    <path d="M83.7 22.5c3.8 0 6.4-2.4 6.4-6.1 0-.4 0-.8-.1-1.2h-9.8c.4-2.1 2.1-3.4 4.5-3.4 1.6 0 2.9.5 4.2 1.4l1.5-2.1c-1.6-1.3-3.5-2-5.7-2-4.4 0-7.4 3-7.4 7.3 0 4.3 3 7.1 6.4 7.1zm3.6-6.9c-.2 2.1-1.7 3.5-3.9 3.5-2 0-3.4-1.2-3.7-3.5h7.6z"/>
  </g>
</svg>
